# ============================================================================
# 产品宣传视频规格（spec）模板 —— 每个模块的每个版本一份
#
# 只需要写三类内容：功能描述、镜头清单、旁白。
# 时间线、机位缓动、转场、音效、屏幕标题出现时机、字幕断行、收尾动画、配乐
# 全部由 project/compile_spec.py 按 project/style.py 的统一规范自动生成。
#
# 坐标：原片缩放到 1280 px 宽的「参考坐标」[x0, y0, x1, y1]（16:9 即 1280×720），
#       用 tools/frame.py 带网格的截图量取。
# 原片时间：秒，用 tools/survey.py / source_sheet.py / activity.py 查找。
# 镜头内时间（at、cam、highlight.at 等）：秒；正数从镜头开始算，
#       负数从「本镜头开始叠化到下一镜头」的时刻往回算。
#
# 构建：VIDEO=<模块>/<版本> ./project/build.sh
# 草稿：VIDEO=<模块>/<版本> python3 project/compile_spec.py --estimate   （不跑 TTS，估算时长）
# ============================================================================

module: 产品或模块名称                 # 片头小标题、文档标题，例如：库存管理
out_name: product-demo                # 成片文件名 deliverables/<模块>/<版本>/<out_name>.mp4
source: source/<模块>/source.mp4       # tools/ingest.py 导入后的录屏
source_note: 原片来源、时长、分辨率     # 写进镜头清单

# 可选：覆盖统一规范（project/style.py）中的个别参数。尽量不用，保持系列一致。
# style:
#   colors: {ui_bg: "#ffffff"}        # 产品界面背景色不是浅灰时，改成界面实际背景色
#   voice: {sid: 21}
#   layout: {card_cy: 830, sub_top: 1430}   # 抖音 / 视频号 / 小红书投放：字幕和卡片上移，避开底部文案与操作栏
#   camera: {card_h_max: 1120}

# 命名区域：给 within / view / to / highlight 复用。
regions:
  app: [0, 64, 1280, 700]             # 必填：系统界面可用区域（去掉浏览器栏、任务栏、录屏界面）
  # drawer: [266, 64, 1280, 700]      # 抽屉
  # modal:  [255, 110, 1023, 550]     # 弹窗（镜头 within 它，卡片就不会露出灰色遮罩）

# 隐私：全片模糊。不写 src 表示整片固定位置；写 src 表示只在该原片时段内。
privacy:
  - {rect: [1150, 64, 1278, 84], note: 右上角登录用户名}
  # - {rect: [400, 130, 480, 700], src: [10.0, 25.0], note: 客户名称列}

sections:
  # -------------------------------------------------------------- 开场钩子（必需，第一个）
  - kind: hook
    headline: 一句话价值主张           # 8–12 字
    beats:                            # 一个 beat = 一句旁白 + 这句话期间开始的镜头
      - vo: 痛点问句，十来个字？         # 旁白 = 字幕；12–20 字，约 4.9 字/秒
        shots:
          - id: S1
            shows: 列表页全貌，点击某条记录   # 镜头清单里「展示的真实功能」
            src: [3.0, 5.8]               # 原片播放区间；单个数字 = 定格
            speed: 1                      # 默认 fit：在 0.55–1 倍速之间自动放慢以填满镜头
            delay: 3.5                    # 先定格 3.5 s 再开始播放（看全景、等旁白）
            cam:                          # 机位关键帧：[镜头内时间, 要展示的区域]
              - [0, app]                  # 先看全景
              - [5.5, [100, 64, 620, 700]]  # 缓慢推近到点击目标
            highlight:
              - {rect: [283, 141, 330, 161], at: [4.5], label: 点击记录, pos: bottom}
            click: [5.6, 312, 152]        # [原片时间, x, y]：涟漪 + 点击音效，自动换算到成片时间
            min: 5.8                      # 本镜头至少单独停留多久（不够时下一句旁白会顺延）
            note: 点击后、页面加载前定格    # 镜头清单「敏感信息 / 缺陷处理」
      - vo: 产品一句话价值，十几个字。

  # -------------------------------------------------------------- 功能（每个卖点一节，可多节）
  - title: 功能一名称                  # 镜头清单 / 旁白文档中的段名
    kicker: 01  功能一 · 使用角色        # 屏幕小标题；不写则为「01  <title>」
    headline: 功能一标题，8–12 字
    desc: 功能描述：这段画面证明了什么，写给交付说明。
    beats:
      - vo: 功能一第一句：画面里正在发生的操作，
        shots:
          - id: S2a
            shows: 详情页 / 抽屉：……
            src: [7.0, 9.0]
            view: app                     # 镜头开始时展示的区域
            to: [200, 64, 900, 700]       # 结束时展示的区域（自动缓慢推拉）
            # move: [1.5, -0.2]           # 推拉的起止时间；默认整段
            # within: drawer              # 限定取景在区域内（抽屉、弹窗必写）
            # blur: [[845, 560, 965, 700]]  # 本镜头额外模糊
            # sweep:                      # 依次扫过一组节点（链路、步骤条）
            #   nodes: [[291, 300, 391, 405], [418, 294, 518, 412]]
            #   at: 0.9
            #   step: 0.33
      - vo: 功能一第二句：以及它带来的结果。
        # headline: 本句起换一个主标题     # 同一功能内换标题
        # pause: 0.4                      # 本句前多停一会
        # tts: 实际朗读的文字              # 语音识别听错时，改读法而不改字幕
        # em: [功能词]                    # 字幕中用强调色突出的词（每句 1–2 个）
        shots:
          - id: S2b
            shows: 操作结果：成功提示、状态变化……
            src: [10.0, 12.5]
            match: prev                   # 与上一镜头同一页面：沿用其末帧机位，无缝叠化
            to: [300, 64, 820, 700]
            highlight:
              - {rect: [600, 70, 680, 92], src_at: [11.0, 12.5], spot: 0.12, chime: true}  # 按原片时间出现

  # -------------------------------------------------------------- 价值收束（必需，最后一个）
  - kind: closing
    kicker: 闭环
    headline: 一条链路，串起全流程
    chain: [步骤一, 步骤二, 步骤三, 步骤四]          # 4–6 个关键词，逐个点亮
    closing_lines: [收尾第一行, 收尾第二行，价值主张]  # 恰好两行
    beats:
      - vo: 收尾旁白，从……到……，让……清晰、灵活、高效。
        shots:
          - id: S9
            shows: 最能代表成果的画面
            src: 20.0
            view: app
            at: -0.35

# 以下用于交付文档（tools/qa.py 自动生成 DELIVERY.md）
unused:                               # 未使用的原片段落
  - {src: [0.0, 2.0], what: 录屏软件界面, why: 录屏工具干扰}
gaps: []                              # 素材缺口：brief 要求但原片没有的画面，建议补录多少秒
changes: []                           # 相对上一版的改动
review_notes: []                      # 人工检查结论（逐帧检查联系表后填写）
