  - {src: [0.0, 1.6], what: OBS 递归录屏画面, why: 录屏工具干扰}
  - {src: [1.6, 5.4], what: 产品清单页、订单管理加载空白, why: 无关 / 加载态}
  - {src: [8.8, 9.6], what: 客户下拉列表, why: 含客户名称}
  - {src: [10.8, 13.3], what: 签约时间日期选择, why: 时长限制}
