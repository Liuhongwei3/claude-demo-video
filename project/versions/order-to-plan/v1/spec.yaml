  - {src: [29.1, 31.9], what: Windows 文件选择窗口, why: 系统界面，含本地文件名}
  - {src: [42.1, 55.9], what: 查看订单产品明细、新增产品（取消）、第一次打开下达确认框后取消, why: 与主线无关 / 重复}
  - {src: [57.3, 59.5], what: 下达后表格刷新, why: 加载态}
  - {src: [60.7, 68.4], what: 产品清单管理（产品状态「工艺编制中」）与菜单切换, why: 时长限制 / 加载态}
  - {src: [71.5, 74.4], what: 菜单切换到计划管理, why: 加载态}

gaps:
  - 下载导入模板：原片只有鼠标悬停「下载订单产品导入模板」，没有点击下载，成片只标注入口；如需展示下载过程，建议补录约 2 秒。
  - 工艺卡片自动创建：原片没有下达前的工艺卡片页面作对比，成片只展示下达后已存在的 3 条对应记录。
  - 品牌：原片没有产品名称或 Logo，成片用纯文字收尾；提供正式品牌素材后可替换收尾文案。
  - 画质：未登录只能获取 720P，提供 BILIBILI_SESSDATA 可换 1080P / 4K 原片重新渲染，坐标不用改。

review_notes:
  - 每 0.5 秒抽帧并逐个转场检查（tools/review.py），成片不含 OBS 递归画面、浏览器栏与平台水印、Windows 文件选择窗口、加载空白或表格刷新态。
  - 三个成功提示（导入 2 个产品成功、订单创建成功!、成功下达3项计划）和状态变化（已下达、工艺编制中、点击制定工艺）均为原片画面，未合成任何业务结果。
  - 客户字段与下拉、客户编号 / 名称列、单价、责任人、总金额、产值单价与金额、右上角登录账号均已模糊，列表页模糊覆盖整列。
  - 叙事顺序与原片的差异：原片先进入工艺卡片（68.5 s）再进入计划管理（74.4 s），成片按「计划 → 工艺」先后调换，两页都是下达后的状态。
  - 所有界面保持原始宽高比，只做裁切放大（最高 2.4 倍）；720P 原片放大后小字略软。

changes:
  - 首版。移动端短视频规格：目标约 28 s；字幕上移到 y=1430（避开平台底部文案与操作栏），卡片中心上移到 y=830、最高 1120 px；收尾关键词停留 3 s。
  - 字幕关键词高亮（`em`），用强调色突出功能词。
