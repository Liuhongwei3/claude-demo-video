# 从订单创建到生产计划下达 · v1
# 移动端短视频（目标约 28 s）：订单创建 → 明细录入与模板导入 → 保存 → 下达计划 → 计划管理 → 工艺卡片。
# 字段说明见 project/templates/spec.yaml 与 skills/screen-recording-promo/reference/spec-reference.md。

module: 订单到生产计划
out_name: order-to-plan-demo
source: source/order-to-plan/source.mp4
source_note: B 站 [BV1G6nw6jE56](https://www.bilibili.com/video/BV1G6nw6jE56/)，78.4 s，未登录只能获取 1280×720 / 30fps 版本

style:
  # 抖音、视频号、小红书底部有账号名、文案和操作栏：字幕上移到安全区，卡片随之上移、限高
  layout: {card_cy: 830, sub_top: 1430}
  camera: {card_h_max: 1120}
  # 短视频节奏：换节停顿 0.4 s，收尾关键词停留 3 s
  timing: {section_gap: 0.4, closing_after: 1.7, min_tail: 3.0}

regions:
  app: [104, 88, 1280, 700]             # 去掉浏览器栏（含平台水印）、左侧菜单和任务栏
  modal: [160, 140, 1120, 478]          # 创建订单弹窗（无明细）
  modal1: [160, 140, 1120, 456]         # 创建订单弹窗（1 行明细）
  modal3: [160, 140, 1120, 514]         # 创建订单弹窗（3 行明细）
  cust_cols: [445, 140, 640, 700]       # 订单列表：客户编号、客户名称
  amount_col: [935, 140, 1005, 700]     # 订单列表：总金额(含税)

privacy:
  - {rect: [1168, 92, 1280, 110], note: 右上角登录账号与角色}
  - {rect: [208, 178, 480, 202], src: [8.8, 40.0], note: 创建订单弹窗的客户字段}
  - {rect: [735, 338, 885, 420], src: [16.9, 40.0], note: 明细行的单价、责任人}

sections:
  # ------------------------------------------------------------------ 开场
  - kind: hook
    kicker: 订单 · 计划 · 工艺，顺畅衔接
    headline: 从订单创建，到生产准备
    beats:
      - vo: 从订单创建开始，让生产准备更顺畅。
        em: [订单创建, 生产准备]
        shots:
          - id: S1
            shows: 订单管理列表，点击「创建订单」
            within: app
            src: [5.50, 7.32]
            align: end
            view: [104, 92, 580, 540]
            to: [104, 96, 540, 470]
            blur: [cust_cols, amount_col]
            highlight:
              - {rect: [112, 119, 170, 138], at: [-1.3], label: 创建订单, pos: bottom}
            click: [7.30, 140, 129]
            note: 跳过 0–5.4 s 的 OBS 递归录屏、无关页面和加载空白；客户编号、客户名称、总金额列模糊

  # ------------------------------------------------------------------ 功能 1
  - title: 创建订单与明细录入
    kicker: 01  创建订单
    headline: 订单信息，清晰录入
    desc: 在「创建订单」弹窗中统一录入合同编号、签约时间、交货时间等基础信息；产品明细可以逐行手动添加，也可以通过批量导入订单产品（导入模板）一次导入多行。
    beats:
      - vo: 填写合同编号、交货时间，快速建立订单。
        em: [合同编号, 交货时间]
        shots:
          - id: S2a
            shows: 创建订单弹窗：输入合同编号 12312
            within: modal
            src: [9.80, 10.80]
            view: [440, 140, 880, 478]
            to: [450, 150, 880, 460]
            highlight:
              - {rect: [490, 178, 790, 202], at: [0.4], label: 合同编号, pos: bottom}
            note: 客户字段模糊；跳过 8.8–9.6 s 客户下拉列表
          - id: S2b
            shows: 交货时间日期选择器，选中 2026-10-31
            within: modal
            src: [13.30, 14.90]
            view: [160, 140, 600, 478]
            at: 1.9
            highlight:
              - {rect: [184, 203, 334, 226], at: [-0.9], label: 交货时间, pos: right}
      - vo: 明细可手动添加，也能用模板批量导入。
        headline: 明细手动添加，支持模板导入
        em: [手动添加, 模板批量导入]
        shots:
          - id: S3a
            shows: 点击「添加产品」，明细表新增一行
            within: modal1
            src: [16.50, 17.80]
            view: [680, 180, 1120, 456]
            highlight:
              - {rect: [1036, 292, 1100, 314], at: [0.1, 1.0]}
            click: [17.00, 1068, 302]
            min: 1.2
          - id: S3b
            shows: 产品列表工具栏的「批量导入订单产品」「下载订单产品导入模板」，点击批量导入
            within: modal1
            match: prev
            src: [28.10, 29.08]
            at: 1.2
            highlight:
              - {rect: [738, 292, 908, 314], at: [0.15], label: 模板下载 · 批量导入, pos: bottom}
            click: [29.05, 778, 303]
            min: 1.1
            note: 跳过 17.8–28.1 s 逐项填写；跳过 29.1–31.9 s 文件选择窗口（含本地文件名）
          - id: S3c
            shows: 「导入 2 个产品成功」提示，明细新增「测试1」「测试2」两行
            within: app
            src: [32.00, 33.70]
            at: 2.3
            cam: [[0, [440, 92, 880, 440]], [0.9, [440, 92, 880, 440]], [-0.15, [160, 200, 600, 478]]]
            highlight:
              - {rect: [590, 96, 692, 120], at: [0.15, 1.2], spot: 0.1, chime: true}
              - {rect: [162, 364, 600, 420], at: [1.3], label: 导入 2 行明细, pos: bottom}
            note: 单价、责任人模糊

  # ------------------------------------------------------------------ 功能 2
  - title: 保存订单与下达计划
    kicker: 02  保存订单 · 下达计划
    headline: 订单保存，一步下达计划
    desc: 确认后订单保存并出现在订单列表（订单创建成功，3 项产品）；在订单行点击「请点击下达所有计划」并确认，即下达该订单下的全部计划（成功下达 3 项计划）。
    beats:
      - vo: 确认保存，订单即刻创建。
        em: [确认保存]
        shots:
          - id: S4a
            shows: 创建订单弹窗底部，点击「确定」
            within: modal3
            src: [39.20, 39.92]
            view: [680, 300, 1120, 514]
            highlight:
              - {rect: [1077, 494, 1115, 512], at: [0.1]}
            click: [39.88, 1095, 503]
            min: 1.0
          - id: S4b
            shows: 订单列表：「订单创建成功!」提示，第一行新订单 12312，订单产品项数 3
            within: app
            src: [40.70, 42.05]
            at: 1.05
            view: [104, 92, 544, 420]
            to: [560, 92, 1000, 400]
            move: [0.7, -0.15]
            blur: [cust_cols, amount_col]
            highlight:
              - {rect: [106, 172, 544, 210], at: [0.15, 1.0], label: 新订单 12312, pos: bottom}
              - {rect: [598, 97, 684, 121], at: [1.0], spot: 0.1, chime: true}
            note: 客户编号、客户名称、总金额模糊；跳过 42.1–55.9 s 查看明细、新增产品（取消）和第一次打开确认框
      - vo: 再一键下达全部生产计划。
        em: [下达全部生产计划]
        shots:
          - id: S4c
            shows: 点击「请点击下达所有计划」，确认框「确定下达该订单下所有计划?」点击确定
            within: app
            match: prev
            src: [56.00, 57.30]
            blur: [cust_cols, amount_col]
            highlight:
              - {rect: [766, 134, 893, 178], src_at: [56.35, 57.28]}
            click: [[56.22, 815, 194], [57.25, 868, 164]]
            min: 1.25
          - id: S4d
            shows: 「成功下达3项计划」提示，该订单「所有计划是否下达」变为已下达
            within: app
            match: prev
            src: [59.60, 60.60]
            at: 1.25
            blur: [cust_cols, amount_col]
            highlight:
              - {rect: [598, 97, 700, 121], at: [0.05], spot: 0.1, chime: true}
              - {rect: [784, 178, 872, 208], at: [0.45], label: 计划已下达, pos: bottom}
            note: 跳过 57.3–59.5 s 表格刷新加载

  # ------------------------------------------------------------------ 功能 3
  - title: 计划管理与工艺卡片
    kicker: 03  计划管理 · 工艺准备
    headline: 计划信息，自动承接
    desc: 下达后，该订单的 3 项产品出现在计划管理中（计划编号 Z26-0428~0430，计划状态「工艺编制中」，合同编号 12312）；工艺卡片管理中已有对应的 3 条记录，工艺编号显示「点击制定工艺」，等待后续工艺编制。
    beats:
      - vo: 下达的产品，可在计划管理中查看。
        em: [计划管理]
        shots:
          - id: S5
            shows: 计划管理：前三行为订单 12312 的 3 项产品，计划状态「工艺编制中」，横移到合同编号列
            within: app
            src: [74.60, 77.90]
            view: [104, 116, 544, 430]
            to: [690, 116, 1130, 430]
            move: [1.3, -0.3]
            blur: [[314, 140, 398, 700], [1045, 140, 1166, 700]]
            highlight:
              - {rect: [106, 170, 544, 256], at: [0.35, 1.4], label: 3 项产品进入计划, pos: bottom}
              - {rect: [950, 170, 1047, 256], at: [-1.2], label: 合同 12312, pos: bottom}
            note: 原片中计划管理在工艺卡片之后（74.4 s），为叙事先后调换，两者都是下达后的状态；客户名称、产值单价、金额模糊
      - vo: 同步生成工艺卡片，为工艺编制做准备。
        headline: 工艺卡片，自动创建对应记录
        em: [工艺卡片]
        shots:
          - id: S6
            shows: 工艺卡片管理：计划 Z26-0428~0430（合同 12312）的 3 条记录，工艺编号「点击制定工艺」
            within: app
            src: [68.50, 71.40]
            view: [104, 110, 580, 450]
            to: [104, 116, 544, 400]
            blur: [[272, 140, 352, 700], [1096, 140, 1158, 700]]
            highlight:
              - {rect: [106, 168, 500, 254], at: [0.4], label: 对应记录已创建, pos: bottom}
              - {rect: [144, 168, 208, 254], at: [1.5], spot: 0.1}
            note: 客户名称、金额模糊

  # ------------------------------------------------------------------ 收尾
  - kind: closing
    kicker: 订单 · 计划 · 工艺
    headline: 订单到计划，顺畅衔接
    chain: [订单, 计划, 工艺]
    closing_lines: [订单到计划，生产准备更高效, 让生产业务衔接更顺畅]
    beats:
      - vo: 订单到计划，生产准备更高效。
        em: [生产准备更高效]
        shots:
          - id: S7
            shows: 工艺卡片管理中订单 12312 的 3 条记录（定格）
            within: app
