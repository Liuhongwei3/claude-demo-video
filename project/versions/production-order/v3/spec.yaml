    headline: 工序链路，一目了然
    desc: 从工单进入详情，看到完整工艺路线；每道工序的状态、首检结论一目了然；点开工序看到对应任务和前后工序。
    beats:
      - vo: 点击工单进入详情，即可查看完整工序链路，
        shots:
          - id: S2a
            blur: [[845, 560, 965, 700]]   # 工单详情任务表的执行人列
            shows: 工单详情抽屉：工单信息、交付进度、含 5 道工序的工艺路线
            within: drawer
            src: [5.42, 6.32]
            speed: 1
            view: [266, 64, 1020, 700]
            to: chain_close
            move: [2.2, -0.15]
            sweep:
              nodes: [[291, 300, 391, 405], [418, 294, 518, 412], [546, 300, 645, 406],
                      [673, 316, 770, 388], [800, 316, 898, 388]]
              at: 0.9
              step: 0.33
      - vo: 每道工序的状态与进度，一目了然。
        shots:
          - id: S2b
            blur: [[845, 560, 965, 700]]   # 工单详情任务表的执行人列
            shows: 悬停工序卡，出现首检状态提示与「在此处插入」
            within: drawer
            match: prev
            src: [7.45, 10.80]
            to: chain_click
            sweep:
              path: [[0.35, [285, 288, 397, 418]], [1.25, [412, 288, 524, 418]], [1.85, [540, 294, 651, 412]]]
            note: 避开 11.7–12.7 s 抽屉滚动
      - vo: 点开任一工序，对应任务、前后工序一并呈现。
        headline: 工序任务，前后衔接
        shots:
          - id: S2c
            blur: [[845, 560, 965, 700]]   # 工单详情任务表的执行人列
            shows: 点击工序卡「工艺处理」
            within: drawer
            match: prev
            src: [12.95, 14.15]
            click: [13.42, 338, 342]
            at: 0.25
            min: 0.7
          - id: S2d
            shows: 目标任务详情：状态、完成进度、上一道 / 下一道工序、执行记录
            within: task_modal
            src: [13.85, 17.70]
            view: [257, 110, 767, 550]
            to: [264, 110, 760, 550]
            at: 0.95
            highlight:
