unused:
  - {src: [0.0, 2.2], what: 录屏软件界面, why: 录屏工具干扰}
  - {src: [17.7, 33.6], what: 关闭任务详情、第一次打开插入弹窗后关闭, why: 重复、无结果}
  - {src: [35.6, 54.0], what: 插入表单逐项填写, why: 过程冗长}
  - {src: [60.3, 94.9], what: 新工序任务详情、「取消目标任务」确认框（点了返回）, why: 删除操作没有确认，不能作为证据}
  - {src: [115.5, 125.0], what: 「取消派发」确认框、Windows 窗口切换, why: 与主线无关 / 系统界面}

gaps:
  - 任务报工：原片没有展开「操作 ▾」菜单或报工弹窗，成片只标注「任务操作入口」，建议补录约 3 秒。
  - 批量派发结果：原片没有点击「确定」提交派发，建议补录约 3 秒。
  - 画质：未登录只能获取 720P，提供 SESSDATA 可换 4K 原片重新渲染。

changes:
  - 与 v2 使用同一份原片、同一套镜头和旁白，改用声明式 spec 编写；时间线、机位、音效、标题、收尾和配乐由编译器按统一规范生成。
  - 句间停顿统一为 0.3 s（换章节 0.5 s），总时长 49.9 s（v2 手工排布为 50.8 s）。
  - 超过 16 字的字幕自动在逗号处断成两行（第 2 句也随之分行）。

review_notes:
  - 每 1 秒抽帧并逐个转场检查（tools/review.py），画面与 v2 等效，没有加载态、骨架屏或弹窗外遮罩。
  - 高亮、标签、点击涟漪位置与 v2 一致；执行人、客户名、参与人、下拉选项、登录用户名均已模糊。

