# 生产工单全流程管理 · v3
# v2 的同一套剪辑，改用声明式 spec 编写：旁白、镜头、功能描述都写在这里，
# 时间线、机位、音效、标题、收尾、配乐由 project/compile_spec.py 按 project/style.py 的统一规范生成。
# 字段说明见 project/templates/spec.yaml。

module: 生产工单全流程管理
out_name: production-workflow-demo
source: source/source.mp4
source_note: B 站 [BV1j8pq6oEqi](https://www.bilibili.com/video/BV1j8pq6oEqi/)「以工序链路来高效管理生产工单和任务派发」，125 秒，使用 1280×720 / 30fps 版本

regions:
  app: [0, 64, 1280, 700]               # 去掉浏览器栏和任务栏后的系统界面
  list: [84, 64, 1280, 700]             # 列表页（不含折叠侧栏）
  drawer: [266, 64, 1280, 700]          # 工单详情抽屉
  task_modal: [255, 110, 1023, 550]     # 工序任务详情
  insert_modal: [191, 110, 1086, 582]   # 插入目标任务
  detail_modal: [190, 110, 1088, 546]   # 任务详情（派发管理）
  dispatch_modal: [256, 110, 1022, 431] # 任务派发表单
  chain_close: [253, 63, 787, 699]      # 工序链路前半段
  chain_click: [216, 64, 724, 698]      # 点击第一道工序的机位
  sidebar: [0, 64, 462, 642]            # 侧栏菜单

privacy:
  - {rect: [1150, 64, 1278, 84], note: 右上角登录用户名}

sections:
  # ------------------------------------------------------------------ 开场
  - kind: hook
    headline: 让生产工单，真正流转起来
    beats:
      - vo: 生产工单流转慢、进度看不清？
        shots:
          - id: S1
            shows: 生产工单列表，点击工单编码 Z26-0218
            within: list
            src: [2.40, 4.45]
            speed: 1
            delay: 4.3                     # 先定格看全景，点击后、抽屉加载前停住
            cam: [[0, [234, 65, 966, 699]], [4.3, [185, 64, 855, 700]], [6.3, [99, 56, 561, 634]]]
            blur: [[398, 136, 478, 700]]   # 客户名称列
            highlight:
              - {rect: [283, 141, 330, 161], at: [5.3], label: 点击工单, pos: bottom}
            click: [4.28, 312, 152]
            min: 6.4
            note: 客户名称列模糊；点击后、抽屉骨架屏出现前定格
      - vo: 工单、工序、任务，一个系统高效协同。

  # ------------------------------------------------------------------ 功能 1
